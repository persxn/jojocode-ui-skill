<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="Geist, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The eight phases of jojocode-ui-skill, from facts to hand-over, with the review and tighten loop</title>
  <defs>
    <linearGradient id="clay" x1="0" x2="1"><stop offset="0" stop-color="#4A68FF"/><stop offset=".55" stop-color="#8A45FF"/><stop offset="1" stop-color="#C55DFF"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f1fd"/><stop offset=".5" stop-color="#f8f2fb"/><stop offset="1" stop-color="#eef6fc"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6b46e5" flood-opacity=".16"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a85b5"/></marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <text x="48" y="58" font-size="13" font-weight="600" letter-spacing="2" fill="#6d4fd8">HOW A BUILD RUNS</text>
  <text x="48" y="92" font-size="26" font-weight="600" fill="#15123a">Eight phases, one bar to pass</text>

  <g font-size="15">
    <!-- row 1 -->
    <g filter="url(#sh)">
      <rect x="48" y="128" width="250" height="104" rx="18" fill="#fff"/>
      <rect x="338" y="128" width="250" height="104" rx="18" fill="#fff"/>
      <rect x="628" y="128" width="250" height="104" rx="18" fill="#fff"/>
      <rect x="918" y="128" width="234" height="104" rx="18" fill="#fff"/>
    </g>
    <g fill="#5d5b7a" font-family="Geist Mono, ui-monospace, monospace" font-size="12"><text x="68" y="156">00</text><text x="358" y="156">01</text><text x="648" y="156">02</text><text x="938" y="156">03</text></g>
    <g fill="#15123a" font-weight="600" font-size="17"><text x="68" y="182">Facts and mode</text><text x="358" y="182">Analyse the demands</text><text x="648" y="182">Direction</text><text x="938" y="182">Layout and roadmap</text></g>
    <g fill="#5d5b7a" font-size="13"><text x="68" y="208">What is real · Persuade, Operate…</text><text x="358" y="208">One batch of questions → brief</text><text x="648" y="208">One hue → palette, type, motion</text><text x="938" y="208">Archetypes · work packages</text></g>
    <g stroke="#8a85b5" stroke-width="2" marker-end="url(#ar)"><path d="M300 180h34"/><path d="M590 180h34"/><path d="M880 180h34"/><path d="M1035 234v36"/></g>

    <!-- row 2 -->
    <g filter="url(#sh)">
      <rect x="918" y="274" width="234" height="104" rx="18" fill="url(#clay)"/>
      <rect x="628" y="274" width="250" height="104" rx="18" fill="#fff"/>
      <rect x="338" y="274" width="250" height="104" rx="18" fill="#fff"/>
      <rect x="48" y="274" width="250" height="104" rx="18" fill="#fff"/>
    </g>
    <g font-family="Geist Mono, ui-monospace, monospace" font-size="12"><text x="938" y="302" fill="#efeaff">04</text><text x="648" y="302" fill="#5d5b7a">05</text><text x="358" y="302" fill="#5d5b7a">06</text><text x="68" y="302" fill="#5d5b7a">07</text></g>
    <g font-weight="600" font-size="17"><text x="938" y="328" fill="#fff">Build on the kit</text><text x="648" y="328" fill="#15123a">Review: the scorecard</text><text x="358" y="328" fill="#15123a">Tighten</text><text x="68" y="328" fill="#15123a">Verify and hand over</text></g>
    <g font-size="13"><text x="938" y="354" fill="#f4f0ff">Tokens + recipes + template</text><text x="648" y="354" fill="#5d5b7a">14 lenses · 0–4 · pass ≥ 3</text><text x="358" y="354" fill="#5d5b7a">Subtract → hierarchy → … → motion</text><text x="68" y="354" fill="#5d5b7a">Matrix · contrast · keyboard</text></g>
    <g stroke="#8a85b5" stroke-width="2" marker-end="url(#ar)"><path d="M916 326h-34"/><path d="M626 326h-34"/><path d="M336 326h-34"/></g>
    <!-- the loop -->
    <path d="M463 380 C 463 412, 753 412, 753 380" fill="none" stroke="#8A45FF" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/>
    <text x="520" y="420" font-size="12" fill="#6d4fd8">re-render, re-score: up to three rounds</text>
  </g>
</svg>
